; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nucleo_g474re]
platform = ststm32
board = nucleo_g474re
framework = stm32cube

build_flags = 
    -I include
    -I lib/FreeRTOS/Source/include
    -I lib/FreeRTOS/Source/CMSIS_RTOS_V2
    -I lib/FreeRTOS/Source/portable/GCC/ARM_CM4F
    -I lib/STM32G4xx_Nucleo
    -I lib/CMSIS_RTOS_V2
    -D USE_NUCLEO_64
    -mthumb             ; Force Thumb-2 instruction set
    -mfpu=fpv4-sp-d16   ; Unlock the exact G474 Single-Precision FPU
    -mfloat-abi=softfp    ; Tell GCC to pass floats via hardware, not software

lib_deps = 
    FreeRTOS

upload_protocol = stlink
monitor_speed = 115200
monitor_port = /dev/cu.usbmodem103